name: telegram-posts
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["queue.json", "ping.txt", "post.py", ".github/workflows/post.yml"]
  workflow_dispatch:
    inputs:
      ids:
        description: "id постов для немедленной публикации (через пробел)"
        required: false
permissions:
  contents: write
concurrency: telegram-posts
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IDS: ${{ github.event.inputs.ids }}
        run: python3 post.py $IDS
      - name: Save posted.json
        run: |
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "lingofy-bot"
            git config user.email "bot@users.noreply.github.com"
            git add posted.json
            git commit -m "posted"
            git push
          fi
